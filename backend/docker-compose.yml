services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parksmart
      POSTGRES_PASSWORD: parksmart
      POSTGRES_DB: parksmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksmart -d parksmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: python:3.12-slim-bookworm
    ports:
      - "8080:8080"
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql+pg8000://parksmart:parksmart@db:5432/parksmart
      JWT_SECRET_KEY: dev-secret-change-me-in-production
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
