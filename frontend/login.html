<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ParkSmart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">ParkSmart</a>

    <div>
      <a class="btn btn-outline-light me-2" href="parking.html">Parking</a>
      <a class="btn btn-outline-light me-2" href="reservations.html">Reservations</a>
      <a class="btn btn-outline-light" href="admin.html">Admin</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
    <h2>Login</h2>

    <form onsubmit="loginUser(event)">
        <div class="mb-3">
            <input
                id="loginEmail"
                type="email"
                class="form-control"
                placeholder="Email"
                required>
        </div>

        <div class="mb-3">
            <input
                id="loginPassword"
                type="password"
                class="form-control"
                placeholder="Password"
                required>
        </div>

        <button type="submit" class="btn btn-primary">
            Login
        </button>

        <a href="register.html" class="btn btn-secondary">
            Create Account
        </a>
    </form>
</div>

<script src="js/app.js"></script>

</body>
</html>
