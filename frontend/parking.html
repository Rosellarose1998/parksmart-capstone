    <h2>Available Parking</h2>

    <table class="table">
        <tr>
            <th>Spot</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>A1</td>
            <td>Available</td>
            <td>
                <button class="btn btn-success" onclick="reserveSpot('A1')">

            </td>
        </tr>

        <tr>
            <td>A2</td>
            <td>Occupied</td>
            <td>
                <button class="btn btn-secondary" disabled>
                    Unavailable
                </button>
            </td>
        </tr>
