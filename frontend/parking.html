<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Spots - ParkSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<script>
if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
}
</script>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">ParkSmart</a>

    <div class="d-flex align-items-center">
      <span id="userDisplay" class="text-white me-3"></span>
      <a class="btn btn-outline-light me-2" href="parking.html">Parking</a>
      <a class="btn btn-outline-light me-2" href="reservations.html">Reservations</a>
      <a class="btn btn-outline-light me-2" href="admin.html">Admin</a>
      <button class="btn btn-danger" onclick="logoutUser()">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-5">
    <h2>Available Parking</h2>

    <table class="table">
        <thead>
            <tr>
                <th>Spot</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>A1</td>
                <td id="status-A1">Available</td>
                <td><input id="date-A1" type="date" class="form-control"></td>
                <td><button id="button-A1" class="btn btn-success" onclick="reserveSpot('A1')">Reserve</button></td>
            </tr>

            <tr>
                <td>A2</td>
                <td id="status-A2">Available</td>
                <td><input id="date-A2" type="date" class="form-control"></td>
                <td><button id="button-A2" class="btn btn-success" onclick="reserveSpot('A2')">Reserve</button></td>
            </tr>

            <tr>
                <td>B1</td>
                <td id="status-B1">Reserved</td>
                <td>06/10/2026</td>
                <td><button class="btn btn-secondary" disabled>Unavailable</button></td>
            </tr>

            <tr>
                <td>B2</td>
                <td id="status-B2">Available</td>
                <td><input id="date-B2" type="date" class="form-control"></td>
                <td><button id="button-B2" class="btn btn-success" onclick="reserveSpot('B2')">Reserve</button></td>
            </tr>

            <tr>
                <td>C1</td>
                <td id="status-C1">Available</td>
                <td><input id="date-C1" type="date" class="form-control"></td>
                <td><button id="button-C1" class="btn btn-success" onclick="reserveSpot('C1')">Reserve</button></td>
            </tr>
        </tbody>
    </table>
</div>

<script src="js/app.js"></script>

</body>
</html>
