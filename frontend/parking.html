<!DOCTYPE html>
<html>
<head>
    <title>Parking Spots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Available Parking</h2>

    <table class="table">
        <tr>
            <th>Spot</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>A1</td>
            <td>Available</td>
            <td>
                <button class="btn btn-success" onclick="reserveSpot('A1')">
                    Reserve
                </button>
            </td>
        </tr>

        <tr>
            <td>A2</td>
            <td>Occupied</td>
            <td>
                <button class="btn btn-secondary" disabled>
                    Unavailable
                </button>
            </td>
        </tr>
    </table>

</div>

<script src="js/app.js"></script>

</body>
</html>
